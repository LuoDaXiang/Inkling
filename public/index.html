<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inkling</title>
<style>
  :root {
    --ground: #f4f5f6;
    --surface: #ffffff;
    --ink: #1a1f24;
    --ink-soft: #5c676e;
    --line: #d8dee0;
    --accent: #0e6f78;
    --bad: #9c2f2f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #101417;
      --surface: #191e22;
      --ink: #e6eaec;
      --ink-soft: #949fa6;
      --line: #2a3236;
      --accent: #4ec3cd;
      --bad: #e8807f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 48px 20px 80px;
    background: var(--ground);
    color: var(--ink);
    font: 16px/1.6 -apple-system, "Segoe UI", "PingFang SC", sans-serif;
  }
  main { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  h1 { margin: 0; font-size: 1.5rem; letter-spacing: -.02em; }
  h1 small { font-weight: 400; font-size: .8rem; color: var(--ink-soft); margin-left: 8px; }
  textarea {
    width: 100%; min-height: 120px; padding: 14px 16px; resize: vertical;
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--line); border-radius: 4px;
    font: inherit; line-height: 1.6;
  }
  textarea:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  button {
    padding: 10px 20px; border: 0; border-radius: 4px;
    background: var(--accent); color: var(--ground);
    font: inherit; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  label { font-size: 14px; color: var(--ink-soft); display: flex; gap: 6px; align-items: center; }
  select {
    padding: 8px 10px; border: 1px solid var(--line); border-radius: 4px;
    background: var(--surface); color: var(--ink); font: inherit; font-size: 14px;
  }
  audio { width: 100%; }
  #status { font-size: 14px; color: var(--ink-soft); min-height: 1.6em; }
  #status.error { color: var(--bad); }
  #meta {
    font: 12px/1.7 ui-monospace, "SF Mono", Menlo, monospace;
    color: var(--ink-soft); white-space: pre-wrap;
  }
</style>
</head>
<body>
<main>
  <h1>Inkling <small>M01 · TTS</small></h1>

  <textarea id="text" spellcheck="false"
    placeholder="粘一句英文，点合成">The quick brown fox jumps over the lazy dog while the cat watches.</textarea>

  <div class="bar">
    <button id="go">合成</button>
    <label>音色
      <select id="voice">
        <option value="">默认</option>
        <option value="en-US-AvaNeural">Ava（女）</option>
        <option value="en-US-AndrewNeural">Andrew（男）</option>
        <option value="en-US-EmmaNeural">Emma（女）</option>
      </select>
    </label>
    <label>语速
      <select id="speed">
        <option value="">1.0×</option>
        <option value="0.8">0.8×</option>
        <option value="0.9">0.9×</option>
        <option value="1.2">1.2×</option>
      </select>
    </label>
  </div>

  <p id="status"></p>
  <audio id="player" controls hidden></audio>
  <p id="meta"></p>
</main>

<script type="module">
const $ = (id) => document.getElementById(id);
const [text, voice, speed, go, status, player, meta] =
  ["text", "voice", "speed", "go", "status", "player", "meta"].map($);

function say(message, isError = false) {
  status.textContent = message;
  status.classList.toggle("error", isError);
}

go.addEventListener("click", async () => {
  const body = { text: text.value };
  if (voice.value) body.voice = voice.value;
  if (speed.value) body.speed = Number(speed.value);

  go.disabled = true;
  say("合成中…");
  meta.textContent = "";
  const started = performance.now();

  try {
    const res = await fetch("/api/tts", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await res.json();

    if (!res.ok) {
      // 服务端把错误分了类，前端照着分类说人话，而不是甩一个状态码。
      say(`${describe(data.error)}：${data.message}`, true);
      return;
    }

    const ms = Math.round(performance.now() - started);
    player.src = data.url;
    player.hidden = false;
    say(data.cached ? "命中缓存，没有调用 Azure" : "合成完成");
    meta.textContent =
      `key    ${data.key}\n` +
      `format ${data.format}  ${data.bytes.toLocaleString()} 字节\n` +
      `耗时   ${ms} ms${data.cached ? "（缓存）" : ""}`;
    player.play().catch(() => {
      // 浏览器可能拦截自动播放，用户点一下播放器就行，不算错误。
    });
  } catch (err) {
    say(`请求失败：${err.message}`, true);
  } finally {
    go.disabled = false;
  }
});

function describe(kind) {
  return {
    auth: "密钥有问题",
    quota: "额度用完了",
    network: "连不上 Azure",
    rejected: "请求被拒绝",
    too_long: "文本太长",
    empty: "返回了空音频",
    not_found: "找不到",
  }[kind] ?? "出错了";
}
</script>
</body>
</html>
