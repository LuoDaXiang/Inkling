name: CI

on:
  push:
    branches: [main]
  pull_request:

# 只跑离线测试。live 测试要密钥、会消耗额度、可能因为网络失败，
# 不适合挡在每次 push 前面。见 docs/decisions.md 0009。
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 离线测试
        run: npm test
